server:
  port: 8080
  tomcat:
    threads:
      max: 10
      min-spare: 5
    accept-count: 1000

spring:
  profiles:
    active: local
  application:
    name: xinshi-admin
  # 通过环境变量 SPRING_PROFILES_ACTIVE 或 startup.sh 控制激活的 profile
  # SPRING_PROFILES_ACTIVE 未设置时默认使用 default profile
  config:
    import: optional:file:${XINSHI_CONFIG_DIR:/app/config}/db-config.yml

xinshi:
  school:
    name-zh: 江西省上饶市广丰区新实中学
    address-zh: 江西省上饶市广丰县吴村镇
    phone: 0793-2928080
  transcript:
    # 成绩单 PDF 文件输出目录（可通过 profile 覆盖）
    output-dir: ./data/xinshi/results/
  deepseek:
    # DeepSeek API Key，通过环境变量 DEEPSEEK_API_KEY 注入，不配置则不启用润色功能
    api-key: ${DEEPSEEK_API_KEY:}
    base-url: https://api.deepseek.com
    model: deepseek-v4-flash
    timeout-seconds: 30

logging:
  level:
    com.xinshi.admin: INFO

h5:
  score-query:
    enabled: ${H5_SCORE_QUERY_ENABLED:false}
  cookie:
    secure: ${H5_COOKIE_SECURE:true}
  session:
    ttl-seconds: ${H5_SESSION_TTL_SECONDS:3600}
  oauth-state:
    ttl-seconds: 300
  wechat-identity:
    lookup-hmac-secret: ${H5_WECHAT_LOOKUP_SECRET:}
    encryption-secret: ${H5_WECHAT_ENCRYPTION_SECRET:}
  query-context:
    identity-hmac-secret: ${H5_QUERY_IDENTITY_SECRET:}
    encryption-secret: ${H5_QUERY_ENCRYPTION_SECRET:}
  sms:
    mode: ${H5_SMS_MODE:disabled}
    test-code: ${H5_SMS_TEST_CODE:}
    code-hmac-secret: ${H5_SMS_CODE_SECRET:}
  student-id:
    hmac-secret: ${H5_STUDENT_ID_SECRET:}
  guardian-mobile:
    hmac-secret: ${H5_GUARDIAN_MOBILE_SECRET:}

  wechat:
    mock-enabled: ${WECHAT_OAUTH_MOCK_ENABLED:false}
    mock-openid: ${WECHAT_OAUTH_MOCK_OPENID:mock-parent-openid}
    mock-nickname: ${WECHAT_OAUTH_MOCK_NICKNAME:微信家长}

internal:
  xinshi-rag:
    service-id: ${XINSHI_RAG_SERVICE_ID:xinshi-rag}
    signing-secret: ${XINSHI_RAG_SIGNING_SECRET:}
  request:
    max-clock-skew-seconds: 300


